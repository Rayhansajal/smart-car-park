server.port=${PORT:8081}
spring.application.name=parking-management

# Database (Render sets DB_*; local defaults are used on your computer)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/car_parking?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT (the default below is for local development only)
app.jwt.secret=${JWT_SECRET:5A7134743777217A25432A462D4A614E645267556B58703273357638792F423F}
app.jwt.expiration=${JWT_EXPIRATION:86400000}
app.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Frontend
app.frontend.url=${FRONTEND_URL:http://localhost:4200}

spring.jackson.deserialization.fail-on-unknown-properties=false

logging.level.com.parking=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method